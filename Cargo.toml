[package]
name = "s2"
edition = "2024"

# Raising this is a breaking change: label the PR "msrv" (feeds the
# "Breaking Changes" release-notes category in .github/release.yml).
rust-version = "1.86"

version = "0.1.0"
authors = ["Jihyun Yu <yjh0502@gmail.com>", "Sascha Brawer <sascha@brawer.ch>"]

license = "Apache-2.0"

description = "S2 geometric library"
homepage = "https://github.com/yjh0502/rust-s2"
repository = "https://github.com/yjh0502/rust-s2"
documentation = "https://docs.rs/rust-s2"

keywords = ["geo", "s2"]

[features]
default = ["serde", "float_extras"]
serde = ["dep:serde", "bigdecimal/serde"]

[dependencies]
float_extras = { version = "0.1.6", optional = true }
libm = "0.2.6"
bigdecimal = { version = "0.4.10", default-features = false }
serde = { version = "1.0.151", features = ["serde_derive"], optional = true }

[dev-dependencies]
# rand is used only by test-only code (all gated behind #[cfg(test)]),
# so it's a dev-dependency only, not an optional runtime dependency.
rand = { version = "0.10.2" }
