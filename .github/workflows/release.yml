name: Publish release to crates.io

on:
  push:
    tags: ['v*']  # triggered by pushing a tag such as 'v0.1.2'

permissions: {}

jobs:
  test:
    name: Run tests for release candidate
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Build
      run: cargo build --release
    - name: Run tests
      run: cargo test --release

  # https://crates.io/docs/trusted-publishing
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      id-token: write  # for OIDC token exchange
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Authenticate with crates.io
      uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
      id: auth
    - name: Publish release
      run: cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Runs only after a successful crates.io publish, so a GitHub Release
  # never points at a version that isn't actually on crates.io. Uses
  # --generate-notes, which reads .github/release.yml for categorization
  # (see CONTRIBUTING.md for the label/commit-prefix conventions that feed
  # it).
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write  # to create the release
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "${{ github.ref_name }}" --generate-notes
