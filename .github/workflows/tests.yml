name: Unit tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-run-tests:
    name: Build and run unit tests
    runs-on: ubuntu-latest
    permissions: {}

    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "true"

    steps:
    - name: Set up shared compilation cache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Install Rust LLVM tools preview
      run: rustup component add llvm-tools-preview
    - name: Install Rust coverage tool
      uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
      with:
        tool: cargo-llvm-cov
    - name: Fetch Rust dependencies
      run: cargo fetch
    - name: Check formatting
      run: cargo fmt --all --check
    - name: Build
      run: cargo build --features serde --locked
    - name: Run tests
      run: |
        cargo llvm-cov test --cobertura --verbose --output-path cobertura.xml --features serde
    # --all-targets so lints inside #[cfg(test)] code are actually checked --
    # a plain `cargo clippy` never builds test code at all (see #122, where a
    # deny-by-default lint sat unnoticed in test code because of exactly this).
    - name: Check for lint warnings with Clippy
      run: cargo clippy --all-features --all-targets --locked
    - name: Upload test coverage to Coveralls.io
      with:
        fail-on-error: false
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329  # v2.3.8

  # Verifies that the crate actually builds on the rust-version declared in
  # Cargo.toml. If you bump rust-version there, update the pinned toolchain
  # ref below to match (and label the PR "msrv").
  msrv:
    name: Build on minimum supported Rust version
    runs-on: ubuntu-latest
    permissions: {}

    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    # Pinned by branch, not tag: Dependabot won't (and shouldn't) auto-bump this.
    - name: Install pinned MSRV toolchain
      uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a  # 1.86.0
    - name: Fetch Rust dependencies
      run: cargo fetch
    - name: Build with default features
      run: cargo build --locked
    - name: Build with all features
      run: cargo build --locked --all-features
