name: Unit tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-run-tests:
    name: Build and run unit tests
    runs-on: ubuntu-latest
    permissions: {}

    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "true"

    steps:
    - name: Set up shared compilation cache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Install Rust LLVM tools preview
      run: rustup component add llvm-tools-preview
    - name: Install Rust coverage tool
      uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
      with:
        tool: cargo-llvm-cov
    - name: Fetch Rust dependencies
      run: cargo fetch
    - name: Check formatting
      run: cargo fmt --all --check
    - name: Build
      run: cargo build --features serde --locked
    - name: Run tests
      run: |
        cargo llvm-cov test --cobertura --verbose --output-path cobertura.xml --features serde
    - name: Check for lint warnings with Clippy
      run: cargo clippy --locked
    - name: Upload test coverage to Coveralls.io
      with:
        fail-on-error: false
      uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b  # v2.3.6
